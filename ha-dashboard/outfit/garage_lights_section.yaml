type: grid
cards:
- type: horizontal-stack
  cards:
  - type: vertical-stack
    cards:
    - type: heading
      heading: Garage · Polestar 2
      heading_style: title
      icon: mdi:car-electric
      badges:
      - type: entity
        entity: sensor.polestar_2_charger_connection_status
        name: Plugged in
        icon: mdi:power-plug
        color: green
        show_state: true
        show_icon: true
        tap_action:
          action: more-info
        visibility:
        - condition: state
          entity: sensor.polestar_2_charger_connection_status
          state_not:
          - Disconnected
          - unknown
          - unavailable
      - type: entity
        entity: sensor.polestar_2_charger_connection_status
        icon: mdi:power-plug-off-outline
        show_state: true
        show_icon: true
        tap_action:
          action: more-info
        visibility:
        - condition: state
          entity: sensor.polestar_2_charger_connection_status
          state: Disconnected
      - type: entity
        entity: sensor.polestar_2_days_to_service
        icon: mdi:wrench-clock
        show_state: true
        show_icon: true
        tap_action:
          action: more-info
      - type: button
        text: Lights
        icon: mdi:chevron-right
        tap_action:
          action: none
    - type: custom:mushroom-template-card
      entity: sensor.polestar_2_battery_charge_level
      icon: mdi:car-electric
      color: '{% set b = states(''sensor.polestar_2_battery_charge_level'') %} {% set c = states(''sensor.polestar_2_charging_status'') %} {% if not is_number(b) %}var(--hp-muted){% elif c == ''Done'' or b | float >= 100 %}var(--hp-ok){% elif b | float >= 30 %}var(--hp-gold){% elif b | float >= 15 %}var(--hp-warn){% else %}var(--hp-bad){% endif %}'
      primary: Battery
      secondary: '{% set b = states(''sensor.polestar_2_battery_charge_level'') %} {% set r = states(''sensor.polestar_2_range'') %} {% set f = states(''sensor.polestar_2_estimate_full_charge_range'') %} {% set c = states(''sensor.polestar_2_charging_status'') %} {% set line1 = (b | float | round(0) | int ~ ''%'' if is_number(b) else ''Battery unavailable'') ~ ('' · '' ~ (r | float | round(0) | int) ~ '' mi'' if is_number(r) else '''') %} {% set line2 = (((f | float | round(0) | int) ~ '' mi at full charge'') if is_number(f) else '''') ~ ('' · Charge complete'' if c == ''Done'' else '''') %} {{ line1 ~ (''\n'' ~ line2 if line2 else '''') }}'
      multiline_secondary: true
      badge_icon: '{{ ''mdi:lightning-bolt'' if states(''sensor.polestar_2_charging_status'') not in [''Idle'', ''Done'', ''unknown'', ''unavailable''] else '''' }}'
      badge_color: var(--hp-gold)
      features:
      - type: bar-gauge
      features_position: bottom
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      grid_options:
        columns: full
        rows: auto
      card_mod:
        style: "ha-card hui-card-features {\n  --feature-height: 6px;\n  --feature-border-radius: 3px;\n}\n"
    - type: heading
      heading: Charging
      heading_style: subtitle
      icon: mdi:ev-station
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.polestar_2_charging_status
          state_not:
          - Idle
          - unknown
          - unavailable
        - condition: state
          entity: sensor.polestar_2_charger_connection_status
          state_not:
          - Disconnected
          - unknown
          - unavailable
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: sensor.polestar_2_charging_status
        name: Status
        icon: mdi:ev-station
        visibility:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.polestar_2_charging_status
            state_not:
            - Idle
            - unknown
            - unavailable
          - condition: state
            entity: sensor.polestar_2_charger_connection_status
            state_not:
            - Disconnected
            - unknown
            - unavailable
      - type: tile
        entity: sensor.polestar_2_charging_power
        name: Power
        visibility:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.polestar_2_charging_status
            state_not:
            - Idle
            - unknown
            - unavailable
          - condition: state
            entity: sensor.polestar_2_charger_connection_status
            state_not:
            - Disconnected
            - unknown
            - unavailable
      - type: tile
        entity: sensor.polestar_2_charging_time
        name: Time to full
        icon: mdi:timer-sand
        visibility:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.polestar_2_charging_status
            state_not:
            - Idle
            - unknown
            - unavailable
          - condition: state
            entity: sensor.polestar_2_charger_connection_status
            state_not:
            - Disconnected
            - unknown
            - unavailable
      - type: tile
        entity: sensor.polestar_2_charging_target_level
        name: Charge limit
        icon: mdi:battery-lock
        visibility:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.polestar_2_charging_status
            state_not:
            - Idle
            - unknown
            - unavailable
          - condition: state
            entity: sensor.polestar_2_charger_connection_status
            state_not:
            - Disconnected
            - unknown
            - unavailable
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: sensor.polestar_2_service_warning
        name: Service warning
        color: red
        visibility:
        - condition: state
          entity: sensor.polestar_2_service_warning
          state_not:
          - No Warning
          - unknown
          - unavailable
      - type: tile
        entity: sensor.polestar_2_brake_fluid_level_warning
        name: Brake fluid
        color: red
        visibility:
        - condition: state
          entity: sensor.polestar_2_brake_fluid_level_warning
          state_not:
          - No Warning
          - unknown
          - unavailable
      - type: tile
        entity: sensor.polestar_2_engine_coolant_level_warning
        name: Coolant
        color: red
        visibility:
        - condition: state
          entity: sensor.polestar_2_engine_coolant_level_warning
          state_not:
          - No Warning
          - unknown
          - unavailable
      - type: tile
        entity: sensor.polestar_2_oil_level_warning
        name: Oil
        color: red
        visibility:
        - condition: state
          entity: sensor.polestar_2_oil_level_warning
          state_not:
          - No Warning
          - unknown
          - unavailable
  - type: vertical-stack
    cards:
    - type: heading
      heading: Lights & plugs
      heading_style: title
