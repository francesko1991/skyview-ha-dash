              action: perform-action
              perform_action: lock.lock
              target:
                entity_id: lock.front_door
              confirmation:
                text: "Send a lock command to the front door? Its current state is not confirmed."
            grid_options:
              columns: 6
              rows: 1
          - type: button
            name: Unlock…
            icon: "mdi:lock-open-variant"
            show_state: false
            tap_action:
              action: perform-action
