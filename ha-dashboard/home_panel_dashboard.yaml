# Home Panel dashboard — DRAFT generated from the sanitized inventory of 2026-09-26
# Paste into a NEW dashboard: Settings > Dashboards > Add dashboard > New dashboard from scratch,
# then open it > pencil (Edit) > three-dot menu > Raw configuration editor. See INSTALL.md.
# Needs: Mushroom 5.x (custom:mushroom-chips-card). Optional: themes/home_panel.yaml.
# Colours are NOT set here; they live in themes/home_panel.yaml.

title: Home Panel
views:
  - title: Home
    path: home
    icon: "mdi:home"
    type: sections
    max_columns: 3
    theme: Home Panel
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: clock
            clock_style: digital
            clock_size: large
            no_background: true
            grid_options:
              columns: full
          - type: "custom:mushroom-chips-card"
            alignment: start
            chips:
              - type: template
                entity: lock.front_door
                icon: "{{ 'mdi:lock-question' if states('lock.front_door') in ['unknown','unavailable'] else 'mdi:lock' }}"
                icon_color: "{{ 'amber' if states('lock.front_door') in ['unknown','unavailable','jammed','open'] else 'teal' }}"
                content: "Lock: {{ state_translated('lock.front_door') }}"
                tap_action:
                  action: more-info
              - type: template
                icon: "mdi:cctv-off"
                icon_color: "{{ 'red' if ['camera.backyard', 'camera.basement_basement_cam_fluent', 'camera.homesite_back_deck_fluent', 'camera.homesite_driveway_fluent', 'camera.front_gate_fluent', 'camera.front_yard_fluent', 'camera.great_room_great_room_cam_fluent', 'camera.living_room_living_room_cam_fluent', 'camera.front_yard_fluent_2'] | map('states') | select('in', ['unavailable','unknown']) | list | count else 'teal' }}"
                content: "{{ ['camera.backyard', 'camera.basement_basement_cam_fluent', 'camera.homesite_back_deck_fluent', 'camera.homesite_driveway_fluent', 'camera.front_gate_fluent', 'camera.front_yard_fluent', 'camera.great_room_great_room_cam_fluent', 'camera.living_room_living_room_cam_fluent', 'camera.front_yard_fluent_2'] | map('states') | select('in', ['unavailable','unknown']) | list | count }} of 9 cameras offline"
                entity_id:
                  - camera.backyard
                  - camera.basement_basement_cam_fluent
                  - camera.homesite_back_deck_fluent
                  - camera.homesite_driveway_fluent
                  - camera.front_gate_fluent
                  - camera.front_yard_fluent
                  - camera.great_room_great_room_cam_fluent
                  - camera.living_room_living_room_cam_fluent
                  - camera.front_yard_fluent_2
                tap_action:
                  action: navigate
                  navigation_path: /home-panel/cameras
              - type: template
                icon: "mdi:tag-search"
                icon_color: amber
                content: "5 camera names to check"
                tap_action:
                  action: navigate
                  navigation_path: /home-panel/review
              - type: template
                icon: "mdi:lightbulb-off-outline"
                icon_color: "{{ 'red' if ['light.backyard_cam_floodlight', 'light.backyard_floodlight', 'light.basement_entry', 'light.bedroom_hallway_light', 'light.guest_room_hallway_light', 'light.kitchen_kitchen_island_pendants', 'light.kitchen_kitchen_main_lights_2', 'light.kitchen_kitchen_main_lights_zone1', 'light.laundry_light_1', 'light.laundry_light_2', 'light.laundry_light_3', 'light.laundry_light_4', 'light.laundry_light_5', 'light.laundry_light_6', 'light.living_room_lamp', 'light.living_room_living_room_main_lights', 'switch.great_room_great_room_main_lights_zone_2', 'switch.night_light_socket', 'switch.recliners_socket', 'switch.record_player_socket', 'switch.wemo_mini'] | map('states') | select('eq', 'unavailable') | list | count else 'teal' }}"
                content: "{{ ['light.backyard_cam_floodlight', 'light.backyard_floodlight', 'light.basement_entry', 'light.bedroom_hallway_light', 'light.guest_room_hallway_light', 'light.kitchen_kitchen_island_pendants', 'light.kitchen_kitchen_main_lights_2', 'light.kitchen_kitchen_main_lights_zone1', 'light.laundry_light_1', 'light.laundry_light_2', 'light.laundry_light_3', 'light.laundry_light_4', 'light.laundry_light_5', 'light.laundry_light_6', 'light.living_room_lamp', 'light.living_room_living_room_main_lights', 'switch.great_room_great_room_main_lights_zone_2', 'switch.night_light_socket', 'switch.recliners_socket', 'switch.record_player_socket', 'switch.wemo_mini'] | map('states') | select('eq', 'unavailable') | list | count }} lights/plugs unavailable"
                entity_id:
                  - light.backyard_cam_floodlight
                  - light.backyard_floodlight
                  - light.basement_entry
                  - light.bedroom_hallway_light
                  - light.guest_room_hallway_light
                  - light.kitchen_kitchen_island_pendants
                  - light.kitchen_kitchen_main_lights_2
                  - light.kitchen_kitchen_main_lights_zone1
                  - light.laundry_light_1
                  - light.laundry_light_2
                  - light.laundry_light_3
                  - light.laundry_light_4
                  - light.laundry_light_5
                  - light.laundry_light_6
                  - light.living_room_lamp
                  - light.living_room_living_room_main_lights
                  - switch.great_room_great_room_main_lights_zone_2
                  - switch.night_light_socket
                  - switch.recliners_socket
                  - switch.record_player_socket
                  - switch.wemo_mini
                tap_action:
                  action: navigate
                  navigation_path: /home-panel/review
              - type: template
                icon: "mdi:map-marker-question-outline"
                icon_color: grey
                content: "{{ ['light.basement_entry', 'light.bedroom_hallway_light', 'light.guest_room_hallway_light', 'light.laundry_light_1', 'light.laundry_light_2', 'light.laundry_light_3', 'light.laundry_light_4', 'light.laundry_light_5', 'light.laundry_light_6', 'light.living_room_lamp', 'media_player.greatroom_display', 'media_player.home_sync', 'media_player.kitchen_display', 'media_player.master_bedroom_speaker', 'media_player.office_speaker', 'media_player.samsung_tv', 'media_player.soundbar', 'switch.night_light_socket', 'switch.recliners_socket', 'switch.record_player_socket', 'switch.wemo_mini'] | reject('area_id') | list | count }} controls with no area"
                tap_action:
                  action: navigate
                  navigation_path: /home-panel/review
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Security
            heading_style: title
            icon: "mdi:shield-home"
          - type: tile
            entity: lock.front_door
          - type: markdown
            content: "**Lock state is not confirmed.** Home Assistant reports this lock as *{{ state_translated('lock.front_door') }}*, so this dashboard can't show whether the door is locked. The door sensor is *{{ state_translated('binary_sensor.front_door_door') }}*."
