# Home Panel theme — every colour and shape used by the dashboard.
# Edit the hp-* tokens to restyle; the lower block maps them onto Home Assistant and Mushroom variables.
# Install: copy to <config>/themes/ and make sure configuration.yaml has
#   frontend:
#     themes: !include_dir_merge_named themes

Home Panel:
  modes:
    light:
      hp-ground: "#e9edea"
      hp-surface: "#f8faf8"
      hp-surface-2: "#dfe5e1"
      hp-line: "#cbd4ce"
      hp-ink: "#18211d"
      hp-muted: "#56635d"
      hp-glow: "#e39b2d"
      hp-teal: "#1c6b62"
      hp-bad: "#b3372c"
      hp-warn: "#9a6a00"
      hp-ok: "#2d7a4b"
      hp-rgb-glow: "227, 155, 45"
      hp-rgb-teal: "28, 107, 98"
      hp-rgb-bad: "179, 55, 44"
      hp-rgb-warn: "154, 106, 0"
      hp-shadow: "0 1px 2px rgba(20,35,28,.06), 0 4px 14px rgba(20,35,28,.06)"
      lovelace-background: "var(--hp-ground)"
      primary-background-color: "var(--hp-ground)"
      card-background-color: "var(--hp-surface)"
      ha-card-background: "var(--hp-surface)"
      secondary-background-color: "var(--hp-surface-2)"
      divider-color: "var(--hp-line)"
      ha-card-border-color: "var(--hp-line)"
      ha-card-border-radius: "14px"
      ha-card-box-shadow: "var(--hp-shadow)"
      primary-text-color: "var(--hp-ink)"
      secondary-text-color: "var(--hp-muted)"
      primary-color: "var(--hp-teal)"
      accent-color: "var(--hp-glow)"
      error-color: "var(--hp-bad)"
      warning-color: "var(--hp-warn)"
      success-color: "var(--hp-ok)"
      state-light-active-color: "var(--hp-glow)"
      state-switch-active-color: "var(--hp-glow)"
      state-climate-heat-color: "var(--hp-glow)"
      state-climate-cool-color: "var(--hp-teal)"
      state-media_player-active-color: "var(--hp-teal)"
      state-vacuum-active-color: "var(--hp-teal)"
      state-lock-locked-color: "var(--hp-ok)"
      state-lock-unlocked-color: "var(--hp-bad)"
      state-lock-jammed-color: "var(--hp-bad)"
      state-lock-open-color: "var(--hp-bad)"
      mush-chip-background: "var(--hp-surface)"
      mush-chip-border-color: "var(--hp-line)"
      mush-chip-border-width: "1px"
      mush-chip-border-radius: "999px"
      mush-rgb-amber: "var(--hp-rgb-warn)"
      mush-rgb-red: "var(--hp-rgb-bad)"
      mush-rgb-teal: "var(--hp-rgb-teal)"
    dark:
      hp-ground: "#101513"
      hp-surface: "#18201c"
      hp-surface-2: "#222c27"
      hp-line: "#2f3a34"
      hp-ink: "#e4ebe7"
      hp-muted: "#9aa8a1"
      hp-glow: "#f0ab45"
      hp-teal: "#5cb8aa"
      hp-bad: "#ef7d70"
      hp-warn: "#e7b94c"
      hp-ok: "#6cc58f"
      hp-rgb-glow: "240, 171, 69"
      hp-rgb-teal: "92, 184, 170"
      hp-rgb-bad: "239, 125, 112"
      hp-rgb-warn: "231, 185, 76"
      hp-shadow: none
      lovelace-background: "var(--hp-ground)"
      primary-background-color: "var(--hp-ground)"
      card-background-color: "var(--hp-surface)"
      ha-card-background: "var(--hp-surface)"
      secondary-background-color: "var(--hp-surface-2)"
      divider-color: "var(--hp-line)"
      ha-card-border-color: "var(--hp-line)"
      ha-card-border-radius: "14px"
      ha-card-box-shadow: "var(--hp-shadow)"
      primary-text-color: "var(--hp-ink)"
      secondary-text-color: "var(--hp-muted)"
      primary-color: "var(--hp-teal)"
      accent-color: "var(--hp-glow)"
      error-color: "var(--hp-bad)"
      warning-color: "var(--hp-warn)"
      success-color: "var(--hp-ok)"
      state-light-active-color: "var(--hp-glow)"
      state-switch-active-color: "var(--hp-glow)"
      state-climate-heat-color: "var(--hp-glow)"
      state-climate-cool-color: "var(--hp-teal)"
      state-media_player-active-color: "var(--hp-teal)"
      state-vacuum-active-color: "var(--hp-teal)"
      state-lock-locked-color: "var(--hp-ok)"
      state-lock-unlocked-color: "var(--hp-bad)"
      state-lock-jammed-color: "var(--hp-bad)"
      state-lock-open-color: "var(--hp-bad)"
      mush-chip-background: "var(--hp-surface)"
      mush-chip-border-color: "var(--hp-line)"
      mush-chip-border-width: "1px"
      mush-chip-border-radius: "999px"
      mush-rgb-amber: "var(--hp-rgb-warn)"
      mush-rgb-red: "var(--hp-rgb-bad)"
      mush-rgb-teal: "var(--hp-rgb-teal)"
